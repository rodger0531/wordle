<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#121213" />
    <meta
      name="description"
      content="Guess the hidden five-letter word in six tries. A new puzzle every day."
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Wordle</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of dark on
      // light. Mirrors the tokens App writes on every settings change.
      try {
        var saved = JSON.parse(localStorage.getItem("wordle:settings:v1")) || {};
        var root = document.documentElement;
        root.dataset.theme = saved.theme === "light" ? "light" : "dark";
        root.dataset.contrast = saved.highContrast ? "high" : "normal";
      } catch (error) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
